services:
  web:
    build: .
    environment:
      API_INTERNAL_BASE_URL: http://api:3001
      API_PROXY_BASE_URL: http://api:3001
      CMS_PUBLIC_BASE_URL: http://hub-cms.localhost:8080
      ENABLE_DEV_LOGIN: "true"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ../inside-learning-hub-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inside_hub
      PAYLOAD_SECRET: local-docker-payload-secret-2026-change-me
      APP_URL: http://hub-cms.localhost:8080
      PUBLIC_APP_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:8080
      ENABLE_DEV_LOGIN: "true"
      ALLOW_DEV_LOGIN_IN_PRODUCTION_BUILD: "true"
      SEED_DEVELOPMENT_DATA: "true"
      FORCE_LOCAL_MIGRATION_AFTER_DEV_PUSH: "true"
      DEV_EMPLOYEE_EMAIL: employee@inside.local
      DEV_ADMIN_EMAIL: admin@inside.local
      DEV_SUPER_ADMIN_EMAIL: superadmin@inside.local
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: inside-hub
      MINIO_REGION: us-east-1
      MINIO_FORCE_PATH_STYLE: "true"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inside_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inside_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/inside-hub;
      mc anonymous set none local/inside-hub;"

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
